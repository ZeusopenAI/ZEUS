name: Verify (multi-agent loop)

# Verifier chạy trong môi trường sạch, không phải trong phiên của Executor.
# Đây là tầng độc lập thật sự: executor không sửa được log của runner này.

on:
  pull_request:
    paths:
      - "output/**"
      - "input/**"
      - "spec/**"
      - "state/**"
      - "log/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Chạy bộ kiểm (sinh báo cáo mới, không đọc báo cáo cũ)
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          python3 spec/checks.py run \
            --root . --spec spec --input input --output output --log log \
            --state state/state.json --by "ci-verifier" \
            --report "verify/checks-${STAMP}.json" | tee verify-output.txt

      - name: Kiểm ranh giới ghi file của Executor
        if: always()
        run: |
          python3 spec/checks.py ownership --root . --role executor \
            --base "origin/${{ github.base_ref || 'main' }}" || true
          echo "Lưu ý: executor chỉ được ghi output/ và log/. Vi phạm sẽ hiện ở bước trên."

      - name: Lưu báo cáo verify
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: verify-report-${{ github.run_id }}
          path: |
            verify/*.json
            verify-output.txt
          retention-days: 30
          if-no-files-found: warn
