name: FlowKit CI

on:
  pull_request:
    paths:
      - 'flowkit/**'
      - 'docs/FLOWKIT_INTEGRATION.md'
      - '.github/workflows/flowkit-ci.yml'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'flowkit/**'
      - 'docs/FLOWKIT_INTEGRATION.md'
      - '.github/workflows/flowkit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject common credential patterns in FlowKit source
        shell: bash
        run: |
          set -euo pipefail
          findings=$(git grep -nEI -e 'AIza[0-9A-Za-z_-]{35}' -e 'sk-[A-Za-z0-9_-]{20,}' -e 'gh[pousr]_[A-Za-z0-9]{30,}' -e 'github_pat_[A-Za-z0-9_]{20,}' -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- flowkit || true)
          if [ -n "$findings" ]; then
            echo "Potential credentials found in FlowKit source:"
            echo "$findings"
            exit 1
          fi

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            flowkit/requirements.txt
            flowkit/requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install FlowKit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r flowkit/requirements.txt -r flowkit/requirements-dev.txt

      - name: Run Python unit tests
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m pytest flowkit/tests/unit -q

  extension-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Chrome extension bootstrap
        run: node --test flowkit/tests/extension_mv3_bootstrap.test.cjs

  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowkit/dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --prefix flowkit/dashboard
      - name: Build dashboard
        run: npm run build --prefix flowkit/dashboard
