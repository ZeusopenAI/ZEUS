name: Update Hermes subtree

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Hermes source branch, tag, or SHA
        required: true
        default: main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Reject direct updates to the default branch
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
            echo "Dispatch this workflow from a dedicated integration branch." >&2
            exit 1
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update history-preserving Hermes subtree
        env:
          HERMES_SOURCE_REF: ${{ inputs.source_ref }}
        run: scripts/update-hermes-subtree.sh

      - name: Push update branch
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
