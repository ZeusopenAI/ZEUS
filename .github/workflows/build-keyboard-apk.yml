name: Build Zeus AI Keyboard APK

on:
  push:
    paths:
      - 'android-keyboard/**'
      - 'scripts/check-android-keyboard.py'
      - '.github/workflows/build-keyboard-apk.yml'
  pull_request:
    paths:
      - 'android-keyboard/**'
      - 'scripts/check-android-keyboard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Ghim Gradle đúng phiên bản AGP 8.2.0 được test cùng (xem
      # android-keyboard/gradle/wrapper/gradle-wrapper.properties). Runner dùng
      # Gradle rất mới + AGP 8.2 gây:
      #   "Cannot mutate the dependencies of configuration ':app:debugCompileClasspath'
      #    after the configuration was resolved" -> :app:processDebugResources FAILED
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: "8.2"

      - name: In phiên bản Gradle/Java (bằng chứng cho CI)
        run: |
          gradle --version
          java -version

      # Bắt lỗi biên dịch/resource trước khi trả giá bằng một lượt Gradle đầy đủ.
      # Không cần Android SDK — thuần Python.
      - name: Kiểm tra tĩnh (API KeyboardView/Keyboard, resource, XML)
        run: python3 scripts/check-android-keyboard.py

      # Log Gradle bị GitHub lưu ở blob storage (không đọc được từ môi trường
      # không có quyền), nên đẩy các dòng lỗi thành annotation để hiện ngay
      # trong PR/Checks và đọc được qua API annotations.
      - name: Build Debug APK
        working-directory: android-keyboard
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/gradle-debug.log"
          set +e
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::Lỗi Gradle (tóm tắt)"
            grep -nE '^e: |error:|FAILURE:|What went wrong|Caused by:|> Task .* FAILED' "$log" | head -40 || true
            echo "::endgroup::"
            # Annotation = cách duy nhất đọc được lỗi từ ngoài (log nằm ở blob storage).
            # Ưu tiên lỗi javac (path.java:NN: error: … + symbol/location), rồi task hỏng.
            {
              grep -E '\.java:[0-9]+: error:' "$log" | head -6
              grep -E '^ *(symbol|location|required|found):' "$log" | head -6
              grep -E '> Task .* FAILED' "$log" | head -2
            } | sed -e 's/%/%25/g' -e 's/\r$//' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
          fi
          exit "$rc"

      - name: Build Release APK
        working-directory: android-keyboard
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ZeusAIKeyboard-debug
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ZeusAIKeyboard-release
          path: android-keyboard/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
