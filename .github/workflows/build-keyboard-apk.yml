name: Build Zeus AI Keyboard APK

on:
  push:
    paths:
      - 'android-keyboard/**'
      - 'scripts/check-android-keyboard.py'
      - '.github/workflows/build-keyboard-apk.yml'
  pull_request:
    paths:
      - 'android-keyboard/**'
      - 'scripts/check-android-keyboard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      # Bắt lỗi biên dịch/resource trước khi trả giá bằng một lượt Gradle đầy đủ.
      # Không cần Android SDK — thuần Python.
      - name: Kiểm tra tĩnh (API KeyboardView/Keyboard, resource, XML)
        run: python3 scripts/check-android-keyboard.py

      - name: Build Debug APK
        working-directory: android-keyboard
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android-keyboard
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ZeusAIKeyboard-debug
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ZeusAIKeyboard-release
          path: android-keyboard/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
