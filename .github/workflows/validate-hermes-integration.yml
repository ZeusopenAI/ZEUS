name: Validate Hermes integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agents/hermes/**'
      - '.gitignore'
      - 'docs/HERMES_INTEGRATION.md'
      - 'docs/HERMES_VALIDATION.md'
      - 'scripts/update-hermes-snapshot.sh'
      - '.github/workflows/integrate-hermes.yml'
      - '.github/workflows/validate-hermes-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Verify integration manifest
        run: |
          test -d agents/hermes
          test -f agents/hermes/.quang-quy-source-commit
          test -f agents/hermes/LICENSE
          test -f agents/hermes/pyproject.toml
          test -f docs/HERMES_INTEGRATION.md
          test -x scripts/update-hermes-snapshot.sh
          grep -Eq '^[0-9a-f]{40}$' agents/hermes/.quang-quy-source-commit

      - name: Reject tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          blocked=$(git ls-files agents/hermes | grep -E '(^|/)(\.env|credentials\.json|token\.json|cookies\.json|id_rsa|id_ed25519)$|\.(pem|p12|pfx|key)$' | grep -v '/\.env\.example$' || true)
          if [ -n "$blocked" ]; then
            echo "Sensitive-looking tracked files found:"
            echo "$blocked"
            exit 1
          fi

      - name: Scan production code for common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          findings=$(git grep -nEI \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e 'sk-(proj-)?[A-Za-z0-9_-]{20,}' \
            -e 'github_pat_[A-Za-z0-9_]{20,}' \
            -e 'gh[pousr]_[A-Za-z0-9]{30,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'xox[baprs]-[A-Za-z0-9-]{20,}' \
            -e '[0-9]{8,10}:[A-Za-z0-9_-]{35}' \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            -- agents/hermes \
            ':!agents/hermes/.env.example' \
            ':!agents/hermes/tests/**' \
            ':!agents/hermes/website/**' \
            ':!agents/hermes/skills/**' \
            ':!agents/hermes/agent/redact.py' || true)
          if [ -n "$findings" ]; then
            echo "Potential credential patterns found in production paths:"
            echo "$findings"
            exit 1
          fi

      - name: Check secret-shaped values in example configuration
        shell: bash
        run: |
          set -euo pipefail
          findings=$(awk -F= '
            /^[A-Za-z_][A-Za-z0-9_]*(API_KEY|TOKEN|SECRET|PASSWORD|PRIVATE_KEY)=/ {
              value=substr($0, index($0, "=") + 1)
              lower=tolower(value)
              if (value != "" &&
                  lower !~ /^(your_|example|changeme|placeholder|replace_me|test_|dummy|<|\$\{)/) {
                print NR ":" $0
              }
            }
          ' agents/hermes/.env.example)
          if [ -n "$findings" ]; then
            echo "Potential real secret-shaped values found in .env.example:"
            echo "$findings"
            exit 1
          fi

      - name: Parse Python project metadata
        run: |
          python - <<'PY'
          import pathlib, tomllib
          path = pathlib.Path('agents/hermes/pyproject.toml')
          data = tomllib.loads(path.read_text(encoding='utf-8'))
          project = data['project']
          assert project['name'] == 'hermes-agent'
          assert project['requires-python']
          print(project['name'], project['version'], project['requires-python'])
          PY

      - name: Compile Python sources
        run: python -m compileall -q agents/hermes

      - name: Validate update script syntax
        run: bash -n scripts/update-hermes-snapshot.sh
